name: CI
on: [push, pull_request]
# Actions are pinned by commit SHA (a moved tag cannot change CI); Dependabot proposes SHA updates.
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: aireply_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/aireply_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)   # media tests
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check      # Biome: formatting, lint, import order
      - run: npm run typecheck
      - run: npm test
  secrets:
    # Scans the whole history for committed keys and passwords (config: .gitleaks.toml).
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
