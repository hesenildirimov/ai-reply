# Production-like stack. Secrets come from .env (never commit it).
# Only Caddy (TLS) is published to the internet; web, db and redis stay on the internal network.
services:
  db:
    image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    # Owner (superuser) only for migrations and backups; web/worker use the least-privilege role app_rw (docker/db-init.sh).
    environment: { POSTGRES_USER: aireply_owner, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}", POSTGRES_DB: aireply, APP_DB_PASSWORD: "${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}" }
    volumes: [pgdata:/var/lib/postgresql/data, ./docker/db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "aireply_owner", "-d", "aireply"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped
  redis:
    image: redis:7@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    # BullMQ requires noeviction: an evicted job key is a lost customer message. AOF keeps queued jobs across restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes: [redisdata:/data]
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://aireply_owner:${POSTGRES_PASSWORD}@db:5432/aireply
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    command: ["node", "dist/migrate.js"]
    depends_on: { db: { condition: service_healthy } }
  web:
    build: .
    env_file: .env
    environment: &dbenv
      DATABASE_URL: postgres://app_rw:${APP_DB_PASSWORD}@db:5432/aireply
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
  worker:
    build: .
    env_file: .env
    environment: *dbenv
    command: ["node", "dist/worker.js"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
  caddy:
    image: caddy:2@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env, e.g. app.example.az}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    restart: unless-stopped
    depends_on: [web]
  backup:
    # Dumps are encrypted with age to BACKUP_AGE_RECIPIENT (public key) before they are written (scripts/backup.sh).
    build: { context: ., dockerfile: docker/backup.Dockerfile }
    environment:
      PGUSER: aireply_owner
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}"
      BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT in .env (age-keygen, docs/DEPLOY.md)}"
      # Optional off-host copy (docs/DEPLOY.md §5): BACKUP_RCLONE_REMOTE=offsite:aireply-backups plus the "offsite"
      # remote's settings. Only these variables reach this container, not the app's secrets.
      BACKUP_RCLONE_REMOTE: "${BACKUP_RCLONE_REMOTE:-}"
      RCLONE_CONFIG_OFFSITE_TYPE: "${RCLONE_CONFIG_OFFSITE_TYPE:-}"
      RCLONE_CONFIG_OFFSITE_PROVIDER: "${RCLONE_CONFIG_OFFSITE_PROVIDER:-}"
      RCLONE_CONFIG_OFFSITE_ACCOUNT: "${RCLONE_CONFIG_OFFSITE_ACCOUNT:-}"
      RCLONE_CONFIG_OFFSITE_KEY: "${RCLONE_CONFIG_OFFSITE_KEY:-}"
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: "${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}"
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: "${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}"
      RCLONE_CONFIG_OFFSITE_ENDPOINT: "${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}"
    volumes: [./backups:/backups, ./scripts/backup.sh:/backup.sh:ro]
    entrypoint: ["bash", "/backup.sh"]
    restart: unless-stopped
    depends_on: [db]
volumes: { pgdata: {}, redisdata: {}, caddy_data: {}, caddy_config: {} }
