# Production-like stack. Secrets come from .env (never commit it).
# Only Caddy (TLS) is published to the internet; web, db and redis stay on the internal network.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}", POSTGRES_DB: aireply }
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes: [redisdata:/data]
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    environment: &dbenv
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/aireply
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    command: ["node", "dist/migrate.js"]
    depends_on: [db]
  web:
    build: .
    env_file: .env
    environment: *dbenv
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
  worker:
    build: .
    env_file: .env
    environment: *dbenv
    command: ["node", "dist/worker.js"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env, e.g. app.example.az}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    restart: unless-stopped
    depends_on: [web]
  backup:
    image: postgres:16
    environment: { PGPASSWORD: "${POSTGRES_PASSWORD}", BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}" }
    volumes: [./backups:/backups, ./scripts/backup.sh:/backup.sh:ro]
    entrypoint: ["sh", "/backup.sh"]
    restart: unless-stopped
    depends_on: [db]
volumes: { pgdata: {}, redisdata: {}, caddy_data: {}, caddy_config: {} }
